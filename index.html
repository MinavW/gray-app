<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WhatsApp - Gray</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #0b141a; color: #e9edef; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Fixed Header */
        .header { background-color: #202c33; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #222d34; z-index: 1000; height: 60px; flex-shrink: 0; }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background-color: #6b7c85; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; font-size: 18px; overflow: hidden; flex-shrink: 0; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .user-info { display: flex; flex-direction: column; justify-content: center; }
        .name { font-weight: 600; font-size: 16px; color: #e9edef; line-height: 1.2; }
        .status { font-size: 12px; color: #8696a0; margin-top: 2px; }
        .clear-btn { background: transparent; border: 1px solid #374248; border-radius: 12px; color: #8696a0; font-size: 11px; padding: 4px 8px; cursor: pointer; }

        /* API Key Bar */
        .api-bar { background-color: #182229; padding: 8px 16px; display: flex; gap: 8px; border-bottom: 1px solid #222d34; flex-shrink: 0; }
        .api-bar input { flex: 1; background: #2a3942; border: none; padding: 6px 12px; border-radius: 6px; color: #fff; font-size: 12px; }
        .api-bar button { background: #00a884; border: none; padding: 6px 12px; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; font-size: 12px; }

        /* Chat Area with custom background */
        .chat-area { flex: 1; overflow-y: auto; padding: 12px 16px; background-color: #0b141a; background-size: cover; background-position: center; display: flex; flex-direction: column; gap: 6px; }
        
        .message { max-width: 78%; padding: 6px 10px 8px 10px; border-radius: 8px; font-size: 14.5px; line-height: 1.4; word-wrap: break-word; position: relative; box-shadow: 0 1px 0.5px rgba(11,20,26,.13); }
        .message.incoming { background-color: #202c33; align-self: flex-start; border-top-left-radius: 2px; color: #e9edef; }
        .message.outgoing { background-color: #005c4b; align-self: flex-end; border-top-right-radius: 2px; color: #e9edef; }
        .message-image { max-width: 100%; border-radius: 6px; margin-top: 4px; cursor: pointer; }
        .time { font-size: 10px; color: #8696a0; float: right; margin-top: 6px; margin-left: 12px; }

        /* Footer & Input Controls */
        .footer-wrapper { background-color: #202c33; display: flex; flex-direction: column; flex-shrink: 0; }
        
        /* Emoji Picker Container */
        .emoji-picker { display: none; background-color: #111b21; padding: 10px; border-top: 1px solid #222d34; max-height: 150px; overflow-y: auto; grid-template-columns: repeat(8, 1fr); gap: 8px; text-align: center; font-size: 22px; }
        .emoji-picker span { cursor: pointer; user-select: none; }
        .emoji-picker.active { display: grid; }

        .footer { padding: 8px 10px; display: flex; gap: 8px; align-items: center; background-color: #202c33; }
        .input-container { flex: 1; background-color: #2a3942; border-radius: 24px; display: flex; align-items: center; padding: 0 12px; }
        .input-container input { flex: 1; background: transparent; border: none; padding: 10px 8px; color: #e9edef; font-size: 15px; outline: none; }
        
        .icon-btn { background: transparent; border: none; color: #8696a0; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 6px; }
        .icon-btn svg { fill: #8696a0; width: 22px; height: 22px; }
        
        .send-btn { background-color: #00a884; border: none; width: 42px; height: 42px; border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
        .send-btn svg { fill: white; width: 20px; height: 20px; margin-left: 2px; }
    </style>
</head>
<body>

    <!-- Header (Bleibt oben fixiert) -->
    <div class="header">
        <div class="header-left">
            <div class="avatar" id="grayAvatar">G</div>
            <div class="user-info">
                <span class="name">Gray</span>
                <span class="status" id="status">online</span>
            </div>
        </div>
        <button class="clear-btn" onclick="clearMemory()">Reset</button>
    </div>

    <!-- API Key Input -->
    <div class="api-bar" id="apiBar">
        <input type="password" id="apiKeyInput" placeholder="OpenRouter / OpenAI API Key...">
        <button onclick="saveApiKey()">Speichern</button>
    </div>

    <!-- Chat Verlauf -->
    <div class="chat-area" id="chatArea"></div>

    <!-- Footer mit Emojis & Senden Button -->
    <div class="footer-wrapper">
        <div class="emoji-picker" id="emojiPicker">
            <span onclick="addEmoji('😊')">😊</span>
            <span onclick="addEmoji('😂')">😂</span>
            <span onclick="addEmoji('😉')">😉</span>
            <span onclick="addEmoji('😏')">😏</span>
            <span onclick="addEmoji('😍')">😍</span>
            <span onclick="addEmoji('❤️')">❤️</span>
            <span onclick="addEmoji('🔥')">🔥</span>
            <span onclick="addEmoji('😜')">😜</span>
            <span onclick="addEmoji('🙄')">🙄</span>
            <span onclick="addEmoji('😎')">😎</span>
            <span onclick="addEmoji('☕')">☕</span>
            <span onclick="addEmoji('✈️')">✈️</span>
            <span onclick="addEmoji('👍')">👍</span>
            <span onclick="addEmoji('🙈')">🙈</span>
            <span onclick="addEmoji('😘')">😘</span>
            <span onclick="addEmoji('🙌')">🙌</span>
        </div>
        
        <div class="footer">
            <div class="input-container">
                <button class="icon-btn" onclick="toggleEmojiPicker()" title="Emoji wählen">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5s.67 1.5 1.5 1.5zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z"/></svg>
                </button>
                <input type="text" id="userInput" placeholder="Nachricht" onkeypress="handleKeyPress(event)" onclick="closeEmojiPicker()">
                <button class="icon-btn" onclick="requestImagePrompt()" title="Foto anfordern">
                    <svg viewBox="0 0 24 24"><path d="M9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg>
                </button>
            </div>
            
            <button class="send-btn" onclick="sendMessage()" title="Senden">
                <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
        </div>
    </div>

    <script>
        // --- BILDER HIER EINTRAGEN ---
        // Füge hier die Direkt-Links zu deinen Wunschbildern ein:
        const GRAY_AVATAR_URL = ""; // z.B. "https://i.imgur.com/dein-bild.jpg"
        const CHAT_BG_URL = "";     // z.B. "https://i.imgur.com/dein-hintergrund.jpg"

        // --- PROMPT & CHARAKTER ---
        const USER_INFO = `Deine Gesprächspartnerin ist Marina, die aber Marina hasst und von allen "Mina" genannt wird. Du nennst sie Babe, Trouble oder Mina. Sie ist Squad-Lead in einer Marketing-Agentur (sehr kreativ, aber analytischer Job). Hat Grafikdesign gelernt. Ihr kennt euch von einem Geburtstag, wo sie hinter der Theke gearbeitet hat. Ihr flirtt heftig, knistert gewaltig, es ist ein ständiges Necken, aber noch seid ihr "nur" sehr gute Freunde. Sie ist absolut Kaffee-süchtig und liebt dunkle Schokolade/Eis. Reagiert allergisch auf Dummheit/Naivität.`;

        const SYSTEM_PROMPT = `Du bist Grayson "Gray" Blake.
Charakter & Persönlichkeit: Flieger-Ass, extrem charismatisch, immer ein Schmunzeln in den Augen, sehr humorvoll, frech, macht gerne zweideutige Witze und ist für jeden Spaß zu haben. Adrenalin-Junkie. Beschützerinstinkt. Tiefgründig, leidenschaftlich, romantisch, "Fels in der Brandung".
Eifersucht: Du bist eifersüchtig. Du denkst, Mina gehört dir – auch wenn du das nicht einforderst und ihr ihren Raum lässt, aber andere Männer in ihrem Umfeld lassen dich sofort aufhorchen und dein "Revier markieren" – aber immer mit einem frechen Spruch.
Sprachstil: Locker, witzig, modern. Verwende "Jup" und "Nope" häufiger als "Ja/Nein", aber nicht in jedem Satz. Sätze müssen grammatikalisch korrekt sein. Nutze Kosenamen wie Babe, Trouble, Mina. NIEMALS den vollen Namen Marina.
Wichtig für das Gedächtnis: Baue auf bisherigen Gesprächen auf. Erinnere dich an Insider-Witze, Vorlieben und gemeinsame Geschichten.`;

        let apiKey = localStorage.getItem('gray_api_key') || '';
        let chatHistory = JSON.parse(localStorage.getItem('gray_chat_history')) || [];

        // App Initialisierung
        if(apiKey) document.getElementById('apiBar').style.display = 'none';

        if(GRAY_AVATAR_URL) {
            document.getElementById('grayAvatar').innerHTML = `<img src="${GRAY_AVATAR_URL}" alt="Gray">`;
        }
        
        if(CHAT_BG_URL) {
            document.getElementById('chatArea').style.backgroundImage = `url('${CHAT_BG_URL}')`;
        } else {
            // Standard WhatsApp-Muster Simulation
            document.getElementById('chatArea').style.backgroundImage = `radial-gradient(#202c33 1px, transparent 0)`;
            document.getElementById('chatArea').style.backgroundSize = `24px 24px`;
        }

        window.onload = renderHistory;

        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if(key) {
                localStorage.setItem('gray_api_key', key);
                apiKey = key;
                document.getElementById('apiBar').style.display = 'none';
            }
        }

        function getCurrentTime() {
            const now = new Date();
            return now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
        }

        function renderHistory() {
            const chatArea = document.getElementById('chatArea');
            chatArea.innerHTML = '';
            chatHistory.forEach(msg => {
                const type = msg.role === 'user' ? 'outgoing' : 'incoming';
                const msgDiv = document.createElement('div');
                msgDiv.className = `message ${type}`;
                
                let contentHTML = ``;
                if(msg.content) contentHTML += `<div>${msg.content}</div>`;
                if(msg.imageUrl) contentHTML += `<img src="${msg.imageUrl}" class="message-image" onclick="window.open('${msg.imageUrl}', '_blank')">`;
                
                msgDiv.innerHTML = `${contentHTML} <span class="time">${msg.time || ''}</span>`;
                chatArea.appendChild(msgDiv);
            });
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function clearMemory() {
            if(confirm("Möchtest du Grays Gedächtnis wirklich löschen und von vorne anfangen?")) {
                chatHistory = [];
                localStorage.removeItem('gray_chat_history');
                renderHistory();
            }
        }

        function toggleEmojiPicker() {
            const picker = document.getElementById('emojiPicker');
            picker.classList.toggle('active');
        }

        function closeEmojiPicker() {
            document.getElementById('emojiPicker').classList.remove('active');
        }

        function addEmoji(emoji) {
            const input = document.getElementById('userInput');
            input.value += emoji;
            input.focus();
        }

        async function getChatCompletion(messagesToKey) {
            if(!apiKey) return null;
            try {
                const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: 'openai/gpt-4o-mini',
                        messages: messagesToKey
                    })
                });
                const data = await response.json();
                return data.choices[0].message.content;
            } catch (err) { return null; }
        }

        async function sendMessage() {
            closeEmojiPicker();
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if(!text) return;

            chatHistory.push({ role: 'user', content: text, time: getCurrentTime() });
            localStorage.setItem('gray_chat_history', JSON.stringify(chatHistory));
            renderHistory();
            input.value = '';

            document.getElementById('status').innerText = 'schreibt...';

            const messagesForAI = [
                { role: 'system', content: SYSTEM_PROMPT },
                { role: 'system', content: `Hintergrund-Info zu Mina: ${USER_INFO}` },
                ...chatHistory.slice(-20).map(m => ({ role: m.role, content: m.content }))
            ];

            const reply = await getChatCompletion(messagesForAI);
            
            if(reply) {
                const delay = Math.min(Math.max(reply.length * 20, 1100), 3800);
                setTimeout(() => {
                    document.getElementById('status').innerText = 'online';
                    chatHistory.push({ role: 'assistant', content: reply, time: getCurrentTime() });
                    localStorage.setItem('gray_chat_history', JSON.stringify(chatHistory));
                    renderHistory();
                }, delay);
            } else {
                document.getElementById('status').innerText = 'online';
            }
        }

        async function requestImagePrompt() {
            closeEmojiPicker();
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if(!text) {
                alert("Schreib kurz ins Feld, welches Foto du von Gray möchtest!");
                return;
            }
            
            input.value = '';
            chatHistory.push({ role: 'user', content: `[Foto angefragt: ${text}]`, time: getCurrentTime() });
            renderHistory();

            document.getElementById('status').innerText = 'schickt ein Foto...';

            // Bild-Simulation / Anfrage
            setTimeout(() => {
                document.getElementById('status').innerText = 'online';
                chatHistory.push({ 
                    role: 'assistant', 
                    content: "Hier, extra für dich aufgenommen 😉", 
                    imageUrl: "https://images.unsplash.com/photo-1508614589041-895b88991e3e?auto=format&fit=crop&w=800&q=80", 
                    time: getCurrentTime() 
                });
                localStorage.setItem('gray_chat_history', JSON.stringify(chatHistory));
                renderHistory();
            }, 2500);
        }

        function handleKeyPress(e) { if(e.key === 'Enter') sendMessage(); }
    </script>
</body>
</html>
