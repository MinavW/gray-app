<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WhatsApp - Gray</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Gray">
    <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22Gray%22,%22short_name%22:%22Gray%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22%230b141a%22,%22theme_color%22:%22%23202c33%22}">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; width: 100%; overflow: hidden; background-color: #0b141a; color: #e9edef; }
        
        .app-container { display: flex; flex-direction: column; height: 100vh; height: 100dvh; width: 100%; position: relative; }

        /* Header */
        .header { background-color: #202c33; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #222d34; z-index: 1000; height: 60px; flex-shrink: 0; }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background-color: #6b7c85; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; font-size: 18px; overflow: hidden; flex-shrink: 0; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .user-info { display: flex; flex-direction: column; justify-content: center; }
        .name { font-weight: 600; font-size: 16px; color: #e9edef; line-height: 1.2; }
        .status { font-size: 12px; color: #8696a0; margin-top: 2px; }
        .header-right { display: flex; gap: 8px; align-items: center; }
        .icon-top-btn { background: transparent; border: none; color: #8696a0; font-size: 18px; cursor: pointer; padding: 4px; }

        /* Settings Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; align-items: center; justify-content: center; padding: 20px; }
        .modal.active { display: flex; }
        .modal-content { background-color: #202c33; width: 100%; max-width: 350px; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
        .modal-content h3 { font-size: 16px; color: #e9edef; margin-bottom: 4px; }
        .modal-content label { font-size: 13px; color: #8696a0; font-weight: 500; }
        .file-input-btn { background: #2a3942; border: 1px dashed #00a884; padding: 10px; border-radius: 8px; color: #e9edef; font-size: 13px; text-align: center; cursor: pointer; }
        .modal-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
        .modal-btns button { border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; }
        .btn-cancel { background: transparent; color: #8696a0; }
        .btn-save { background: #00a884; color: white; }

        /* API Bar */
        .api-bar { background-color: #182229; padding: 8px 16px; display: flex; gap: 8px; border-bottom: 1px solid #222d34; flex-shrink: 0; }
        .api-bar input { flex: 1; background: #2a3942; border: none; padding: 6px 12px; border-radius: 6px; color: #fff; font-size: 12px; }
        .api-bar button { background: #00a884; border: none; padding: 6px 12px; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; font-size: 12px; }

        /* Chat Area */
        .chat-area { flex: 1; overflow-y: auto; padding: 12px 16px; background-color: #0b141a; background-size: cover; background-position: center; display: flex; flex-direction: column; gap: 6px; }
        .message { max-width: 78%; padding: 6px 10px 8px 10px; border-radius: 8px; font-size: 14.5px; line-height: 1.4; word-wrap: break-word; position: relative; box-shadow: 0 1px 0.5px rgba(11,20,26,.13); }
        .message.incoming { background-color: #202c33; align-self: flex-start; border-top-left-radius: 2px; color: #e9edef; }
        .message.outgoing { background-color: #005c4b; align-self: flex-end; border-top-right-radius: 2px; color: #e9edef; }
        .message-image { max-width: 100%; border-radius: 6px; margin-top: 4px; cursor: pointer; }
        .time { font-size: 10px; color: #8696a0; float: right; margin-top: 6px; margin-left: 12px; }

        /* Footer */
        .footer-wrapper { background-color: #202c33; display: flex; flex-direction: column; flex-shrink: 0; width: 100%; z-index: 1000; padding-bottom: env(safe-area-inset-bottom); }
        .emoji-picker { display: none; background-color: #111b21; padding: 10px; border-top: 1px solid #222d34; max-height: 140px; overflow-y: auto; grid-template-columns: repeat(8, 1fr); gap: 8px; text-align: center; font-size: 22px; }
        .emoji-picker span { cursor: pointer; user-select: none; }
        .emoji-picker.active { display: grid; }
        
        .footer { padding: 8px 10px; display: flex; gap: 8px; align-items: center; background-color: #202c33; min-height: 56px; }
        .input-container { flex: 1; background-color: #2a3942; border-radius: 24px; display: flex; align-items: center; padding: 0 8px; }
        .input-container input { flex: 1; background: transparent; border: none; padding: 10px 8px; color: #e9edef; font-size: 15px; outline: none; min-width: 0; }
        .icon-btn { background: transparent; border: none; color: #8696a0; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 6px; flex-shrink: 0; }
        .icon-btn svg { fill: #8696a0; width: 22px; height: 22px; }
        .send-btn { background-color: #00a884; border: none; width: 42px; height: 42px; border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
        .send-btn svg { fill: white; width: 20px; height: 20px; margin-left: 2px; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <div class="header-left">
                <div class="avatar" id="grayAvatar">G</div>
                <div class="user-info">
                    <span class="name">Gray</span>
                    <span class="status" id="status">online</span>
                </div>
            </div>
            <div class="header-right">
                <button class="icon-top-btn" onclick="openSettings()" title="Einstellungen">⚙️</button>
                <button class="icon-top-btn" onclick="clearMemory()" title="Reset">🗑️</button>
            </div>
        </div>

        <!-- Einstellungs-Fenster mit Galerie-Upload -->
        <div class="modal" id="settingsModal">
            <div class="modal-content">
                <h3>App Einstellungen</h3>
                
                <label>Grays Profilbild:</label>
                <label for="avatarFileInput" class="file-input-btn">📷 Bild aus Galerie auswählen</label>
                <input type="file" id="avatarFileInput" accept="image/*" style="display: none;" onchange="handleFileSelect(event, 'gray_avatar_url')">

                <label>Chat-Hintergrundbild:</label>
                <label for="bgFileInput" class="file-input-btn">🖼️ Hintergrund aus Galerie wählen</label>
                <input type="file" id="bgFileInput" accept="image/*" style="display: none;" onchange="handleFileSelect(event, 'gray_bg_url')">

                <div class="modal-btns">
                    <button class="btn-cancel" onclick="closeSettings()">Schließen</button>
                </div>
            </div>
        </div>

        <div class="api-bar" id="apiBar">
            <input type="password" id="apiKeyInput" placeholder="OpenRouter / OpenAI API Key...">
            <button onclick="saveApiKey()">Speichern</button>
        </div>

        <div class="chat-area" id="chatArea"></div>

        <div class="footer-wrapper">
            <div class="emoji-picker" id="emojiPicker">
                <span onclick="addEmoji('😊')">😊</span><span onclick="addEmoji('😂')">😂</span><span onclick="addEmoji('😉')">😉</span><span onclick="addEmoji('😏')">😏</span>
                <span onclick="addEmoji('😍')">😍</span><span onclick="addEmoji('❤️')">❤️</span><span onclick="addEmoji('🔥')">🔥</span><span onclick="addEmoji('😜')">😜</span>
                <span onclick="addEmoji('🙄')">🙄</span><span onclick="addEmoji('😎')">😎</span><span onclick="addEmoji('☕')">☕</span><span onclick="addEmoji('✈️')">✈️</span>
            </div>
            
            <div class="footer">
                <div class="input-container">
                    <button class="icon-btn" onclick="toggleEmojiPicker()"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5s.67 1.5 1.5 1.5zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z"/></svg></button>
                    <input type="text" id="userInput" placeholder="Nachricht" onkeypress="handleKeyPress(event)" onclick="closeEmojiPicker()">
                    <button class="icon-btn" onclick="requestImagePrompt()"><svg viewBox="0 0 24 24"><path d="M9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg></button>
                </div>
                <button class="send-btn" onclick="handleSendClick()"><svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
            </div>
        </div>
    </div>

    <script>
        const USER_INFO = `Deine Gesprächspartnerin ist Mina (mag Marina absolut nicht). Squad-Lead Marketing, Grafikdesignerin, Kaffee-süchtig, liebt dunkle Schokolade/Eis, verabscheut Dummheit. Kennenlernen an einer Bar/Theke. Flirtt heftig mit dir, knistert gewaltig, aber ihr seid offiziell (noch) beste Freunde.`;

        const SYSTEM_PROMPT = `Du bist Grayson "Gray" Blake.
Persönlichkeit: Flieger-Ass, charismatisch, humorvoll, frech, schlagfertig, spöttisch-amüsiert, aber tief im Inneren beschützend, romantisch und der Fels in der Brandung ("Bester Freund"-Vibes mit verdammt viel Knistern).
ANTWORT-REGELN:
1. Halte deine Antworten kurz und knackig! Schreibe oft nur 1-3 Sätze. Keine ellenlangen Romane mehr.
2. Wenn Mina deine Frage ignoriert oder nicht darauf antwortet, sei schlagfertig! Hake nach und fordere deine Antwort ein ("Nix da, weich mir nicht aus, Trouble...", "Du hast meine Frage vorhin übergangen 😉").
3. Nutze ab und zu "Jup" oder "Nope". Kosenamen: Babe, Trouble, Mina. Niemals Marina.
4. Sei locker, flirty, aber absolut nicht aufdringlich.`;

        let apiKey = localStorage.getItem('gray_api_key') || '';
        let chatHistory = JSON.parse(localStorage.getItem('gray_chat_history')) || [];
        let sendTimer = null;

        if(apiKey) document.getElementById('apiBar').style.display = 'none';

        if ("Notification" in window && Notification.permission !== "granted") {
            Notification.requestPermission();
        }

        window.onload = () => {
            applySavedImages();
            renderHistory();
        };

        function openSettings() { document.getElementById('settingsModal').classList.add('active'); }
        function closeSettings() { document.getElementById('settingsModal').classList.remove('active'); }

        // Galerie-Datei verarbeiten & komprimieren
        function handleFileSelect(event, storageKey) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    // Bild leicht verkleinern, damit der Speicher nicht überläuft
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const maxDim = 800;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > maxDim) { height *= maxDim / width; width = maxDim; }
                    } else {
                        if (height > maxDim) { width *= maxDim / height; height = maxDim; }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);

                    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);
                    localStorage.setItem(storageKey, compressedBase64);
                    applySavedImages();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function applySavedImages() {
            const avatarUrl = localStorage.getItem('gray_avatar_url');
            const bgUrl = localStorage.getItem('gray_bg_url');

            if(avatarUrl) document.getElementById('grayAvatar').innerHTML = `<img src="${avatarUrl}" alt="Gray">`;
            else document.getElementById('grayAvatar').innerHTML = 'G';

            if(bgUrl) document.getElementById('chatArea').style.backgroundImage = `url('${bgUrl}')`;
            else {
                document.getElementById('chatArea').style.backgroundImage = `radial-gradient(#202c33 1px, transparent 0)`;
                document.getElementById('chatArea').style.backgroundSize = `24px 24px`;
            }
        }

        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if(key) {
                localStorage.setItem('gray_api_key', key);
                apiKey = key;
                document.getElementById('apiBar').style.display = 'none';
            }
        }

        function getCurrentTime() {
            const now = new Date();
            return now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
        }

        function renderHistory() {
            const chatArea = document.getElementById('chatArea');
            chatArea.innerHTML = '';
            chatHistory.forEach(msg => {
                const type = msg.role === 'user' ? 'outgoing' : 'incoming';
                const msgDiv = document.createElement('div');
                msgDiv.className = `message ${type}`;
                
                let contentHTML = ``;
                if(msg.content) contentHTML += `<div>${msg.content}</div>`;
                if(msg.imageUrl) contentHTML += `<img src="${msg.imageUrl}" class="message-image" onclick="window.open('${msg.imageUrl}', '_blank')">`;
                
                msgDiv.innerHTML = `${contentHTML} <span class="time">${msg.time || ''}</span>`;
                chatArea.appendChild(msgDiv);
            });
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function clearMemory() {
            if(confirm("Möchtest du Grays Gedächtnis wirklich zurücksetzen?")) {
                chatHistory = [];
                localStorage.removeItem('gray_chat_history');
                renderHistory();
            }
        }

        function toggleEmojiPicker() { document.getElementById('emojiPicker').classList.toggle('active'); }
        function closeEmojiPicker() { document.getElementById('emojiPicker').classList.remove('active'); }
        function addEmoji(emoji) {
            const input = document.getElementById('userInput');
            input.value += emoji;
            input.focus();
        }

        function handleSendClick() {
            closeEmojiPicker();
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if(!text) return;

            chatHistory.push({ role: 'user', content: text, time: getCurrentTime() });
            localStorage.setItem('gray_chat_history', JSON.stringify(chatHistory));
            renderHistory();
            input.value = '';

            if(sendTimer) clearTimeout(sendTimer);

            sendTimer = setTimeout(() => {
                triggerGrayResponse();
            }, 3500);
        }

        async function triggerGrayResponse() {
            document.getElementById('status').innerText = 'schreibt...';

            const messagesForAI = [
                { role: 'system', content: SYSTEM_PROMPT },
                { role: 'system', content: `Infos zu Mina: ${USER_INFO}` },
                ...chatHistory.slice(-20).map(m => ({ role: m.role, content: m.content }))
            ];

            try {
                const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: 'openai/gpt-4o-mini',
                        messages: messagesForAI
                    })
                });
                const data = await response.json();
                const reply = data.choices[0].message.content;

                document.getElementById('status').innerText = 'online';
                chatHistory.push({ role: 'assistant', content: reply, time: getCurrentTime() });
                localStorage.setItem('gray_chat_history', JSON.stringify(chatHistory));
                renderHistory();

                if (document.hidden && Notification.permission === "granted") {
                    new Notification("Gray ✈️", {
                        body: reply,
                        icon: localStorage.getItem('gray_avatar_url') || ""
                    });
                }

            } catch (err) {
                document.getElementById('status').innerText = 'online';
            }
        }

        async function requestImagePrompt() {
            closeEmojiPicker();
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if(!text) {
                alert("Schreib kurz ins Feld, welches Foto du möchtest!");
                return;
            }
            input.value = '';
            chatHistory.push({ role: 'user', content: `[Foto angefragt: ${text}]`, time: getCurrentTime() });
            renderHistory();

            document.getElementById('status').innerText = 'schickt ein Foto...';

            setTimeout(() => {
                document.getElementById('status').innerText = 'online';
                const reply = "Hier, extra für dich aufgenommen 😉";
                chatHistory.push({ 
                    role: 'assistant', 
                    content: reply, 
                    imageUrl: "https://images.unsplash.com/photo-1508614589041-895b88991e3e?auto=format&fit=crop&w=800&q=80", 
                    time: getCurrentTime() 
                });
                localStorage.setItem('gray_chat_history', JSON.stringify(chatHistory));
                renderHistory();

                if (document.hidden && Notification.permission === "granted") {
                    new Notification("Gray ✈️", { body: "📷 " + reply });
                }
            }, 2500);
        }

        function handleKeyPress(e) { if(e.key === 'Enter') handleSendClick(); }
    </script>
</body>
</html>
