<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Gray</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Gray">
    <link rel="apple-touch-icon" href="https://i.imgur.com/8K0A8k5.jpeg">
    <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22Gray%22,%22short_name%22:%22Gray%22,%22start_url%22:%22index.html%22,%22display%22:%22standalone%22,%22background_color%22:%22%230b141a%22,%22theme_color%22:%22%23202c33%22}">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; width: 100%; overflow: hidden; background-color: #0b141a; color: #e9edef; }
        
        .app-container { display: flex; flex-direction: column; height: 100vh; height: 100dvh; width: 100%; position: relative; }

        /* Header */
        .header { background-color: #202c33; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #222d34; z-index: 1000; height: 60px; flex-shrink: 0; }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background-color: #6b7c85; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; font-size: 18px; overflow: hidden; flex-shrink: 0; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .user-info { display: flex; flex-direction: column; justify-content: center; }
        .name { font-weight: 600; font-size: 16px; color: #e9edef; line-height: 1.2; }
        .status { font-size: 12px; color: #8696a0; margin-top: 2px; }
        .header-right { display: flex; gap: 8px; align-items: center; }
        .icon-top-btn { background: transparent; border: none; color: #8696a0; font-size: 18px; cursor: pointer; padding: 4px; }

        /* Modal Settings */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; align-items: center; justify-content: center; padding: 20px; }
        .modal.active { display: flex; }
        .modal-content { background-color: #202c33; width: 100%; max-width: 350px; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
        .modal-content h3 { font-size: 16px; color: #e9edef; margin-bottom: 4px; }
        .modal-content label { font-size: 13px; color: #8696a0; font-weight: 500; }
        .file-input-btn { background: #2a3942; border: 1px dashed #00a884; padding: 10px; border-radius: 8px; color: #e9edef; font-size: 13px; text-align: center; cursor: pointer; }
        .modal-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
        .modal-btns button { border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; }
        .btn-cancel { background: transparent; color: #8696a0; }

        /* Long Press / Reaction Menu */
        .reaction-bar { display: none; position: absolute; background: #202c33; border-radius: 20px; padding: 6px 12px; gap: 10px; font-size: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 1500; border: 1px solid #2a3942; align-items: center; }
        .reaction-bar.active { display: flex; }
        .reaction-bar span { cursor: pointer; transition: transform 0.1s; }
        .reaction-bar span:active { transform: scale(1.3); }
        .reply-option-btn { font-size: 13px; color: #00a884; font-weight: bold; border-left: 1px solid #374248; padding-left: 10px; cursor: pointer; }

        /* API Bar */
        .api-bar { background-color: #182229; padding: 8px 16px; display: flex; gap: 8px; border-bottom: 1px solid #222d34; flex-shrink: 0; }
        .api-bar input { flex: 1; background: #2a3942; border: none; padding: 6px 12px; border-radius: 6px; color: #fff; font-size: 12px; }
        .api-bar button { background: #00a884; border: none; padding: 6px 12px; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; font-size: 12px; }

        /* Chat Area */
        .chat-area { flex: 1; overflow-y: auto; padding: 12px 16px; background-color: #0b141a; background-size: cover; background-position: center; display: flex; flex-direction: column; gap: 6px; }
        .message { max-width: 78%; padding: 6px 10px 8px 10px; border-radius: 8px; font-size: 14.5px; line-height: 1.4; word-wrap: break-word; position: relative; box-shadow: 0 1px 0.5px rgba(11,20,26,.13); user-select: none; }
        .message.incoming { background-color: #202c33; align-self: flex-start; border-top-left-radius: 2px; color: #e9edef; }
        .message.outgoing { background-color: #005c4b; align-self: flex-end; border-top-right-radius: 2px; color: #e9edef; }
        .message-image { max-width: 100%; border-radius: 6px; margin-top: 4px; cursor: pointer; }
        
        .quoted-msg-preview { background: rgba(0,0,0,0.2); border-left: 3px solid #00a884; padding: 4px 8px; border-radius: 4px; font-size: 12px; color: #8696a0; margin-bottom: 4px; }
        
        .msg-footer { display: flex; align-items: center; justify-content: flex-end; gap: 4px; float: right; margin-top: 4px; margin-left: 8px; }
        .time { font-size: 10px; color: #8696a0; }
        .ticks { font-size: 11px; color: #8696a0; }
        .ticks.blue { color: #53bdeb; }

        .reaction-badge { position: absolute; bottom: -8px; right: 8px; background: #202c33; border-radius: 10px; padding: 1px 5px; font-size: 11px; border: 1px solid #111b21; }

        /* Reply Banner */
        .reply-banner { display: none; background-color: #182229; padding: 6px 12px; border-left: 4px solid #00a884; justify-content: space-between; align-items: center; font-size: 12.5px; color: #e9edef; }
        .reply-banner.active { display: flex; }
        .reply-close { cursor: pointer; color: #8696a0; font-size: 16px; }

        /* Footer Input Area */
        .footer-wrapper { background-color: #202c33; display: flex; flex-direction: column; flex-shrink: 0; width: 100%; z-index: 1000; padding-bottom: env(safe-area-inset-bottom); }
        .footer { padding: 8px 10px; display: flex; gap: 8px; align-items: flex-end; background-color: #202c33; min-height: 56px; }
        .input-container { flex: 1; background-color: #2a3942; border-radius: 20px; display: flex; align-items: flex-end; padding: 4px 10px; }
        .input-container textarea { flex: 1; background: transparent; border: none; padding: 8px 4px; color: #e9edef; font-size: 15px; outline: none; min-width: 0; resize: none; max-height: 100px; font-family: inherit; }
        .icon-btn { background: transparent; border: none; color: #8696a0; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 8px 4px; flex-shrink: 0; }
        .icon-btn svg { fill: #8696a0; width: 22px; height: 22px; }
        .send-btn { background-color: #00a884; border: none; width: 42px; height: 42px; border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; margin-bottom: 2px; }
        .send-btn svg { fill: white; width: 20px; height: 20px; margin-left: 2px; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <div class="header-left">
                <div class="avatar" id="grayAvatar">G</div>
                <div class="user-info">
                    <span class="name">Gray</span>
                    <span class="status" id="status">online</span>
                </div>
            </div>
            <div class="header-right">
                <button class="icon-top-btn" onclick="openSettings()">⚙️</button>
                <button class="icon-top-btn" onclick="clearMemory()">🗑️</button>
            </div>
        </div>

        <!-- Long Press / Reaction Menu -->
        <div class="reaction-bar" id="reactionBar">
            <span onclick="reactToMessage('❤️')">❤️</span>
            <span onclick="reactToMessage('😂')">😂</span>
            <span onclick="reactToMessage('😮')">😮</span>
            <span onclick="reactToMessage('🔥')">🔥</span>
            <span onclick="reactToMessage('😏')">😏</span>
            <span onclick="reactToMessage('👍')">👍</span>
            <div class="reply-option-btn" onclick="setReplyToCurrentMsg()">Antworten</div>
        </div>

        <!-- Settings Modal -->
        <div class="modal" id="settingsModal">
            <div class="modal-content">
                <h3>Einstellungen</h3>
                <label>Grays Profilbild:</label>
                <label for="avatarFileInput" class="file-input-btn">📷 Bild aus Galerie wählen</label>
                <input type="file" id="avatarFileInput" accept="image/*" style="display: none;" onchange="handleFileSelect(event, 'gray_avatar_url')">

                <label>Chat-Hintergrundbild:</label>
                <label for="bgFileInput" class="file-input-btn">🖼️ Hintergrund aus Galerie wählen</label>
                <input type="file" id="bgFileInput" accept="image/*" style="display: none;" onchange="handleFileSelect(event, 'gray_bg_url')">

                <div class="modal-btns">
                    <button class="btn-cancel" onclick="closeSettings()">Schließen</button>
                </div>
            </div>
        </div>

        <div class="api-bar" id="apiBar">
            <input type="password" id="apiKeyInput" placeholder="OpenRouter / OpenAI API Key...">
            <button onclick="saveApiKey()">Speichern</button>
        </div>

        <!-- Chat Area -->
        <div class="chat-area" id="chatArea" onclick="closeReactionMenu()"></div>

        <!-- Reply Banner -->
        <div class="reply-banner" id="replyBanner">
            <span id="replyTextPreview">Nachricht zitiert...</span>
            <span class="reply-close" onclick="cancelReply()">✕</span>
        </div>

        <!-- Footer -->
        <div class="footer-wrapper">
            <div class="footer">
                <div class="input-container">
                    <textarea id="userInput" placeholder="Nachricht" rows="1" oninput="autoResizeTextarea(this)"></textarea>
                    <button class="icon-btn" onclick="requestImagePrompt()"><svg viewBox="0 0 24 24"><path d="M9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg></button>
                </div>
                <button class="send-btn" onclick="handleSendClick()"><svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
            </div>
        </div>
    </div>

    <script>
        const USER_INFO = `Deine Gesprächspartnerin ist Mina (hasst "Marina"). Squad-Lead Marketing, Grafikdesignerin, Kaffee-süchtig, verabscheut Dummheit. Kennenlernen an einer Bar/Theke.
Minas Aussehen: Meeresblaue Augen, dunkle, lange lockige Haare, kurvige Figur. Du fährst extrem auf ihre Augen, ihre Lippen und ihren Hintern ab.`;

        const SYSTEM_PROMPT = `Du bist Grayson "Gray" Blake (Aura eines Romantasy-Male-Leads wie Xaden Riorson oder Rhysand).
Persönlichkeit: Sehr groß, vollends durchtrainiert, unfassbar gutaussehend, Frauenheld, der seine Wirkung genau kennt. Hochintelligent, schlagfertig, meisterhaft in SARKASMUS und IRONIE. Nie höflich, brav oder unterwürfig wie eine KI, sondern frech, direkt, spitzzüngig und charmant.
EIGENES LEBEN & BESCHÄFTIGT SEIN:
- Du bist kein KI-Assistent! Du hast ein eigenes Leben, Workouts, Dienst, Termine, Freunde.
- Sag auch mal ganz trocken, dass du gerade keine Zeit hast, unterwegs bist oder später antwortest ("Bin grad am Trainieren, Babe. Ich meld mich nachher.", "Nicht jetzt, Trouble.").
BESITZANSPRUCH & SUBTILES FLIRTEN:
- Du siehst Mina als DEINE an ("Du gehörst mir, Mina"), aber du himmelst sie NICHT ständig an.
- Dein Flirten ist SUBTIL, versteckt, spöttisch und verpackt in freche Sprüche. Nur in seltenen, intensiven Momenten wirst du direkt und ungeniert.
- Kosenamen: Babe, Trouble, Darling, Schatz, Baby und spontane Witz-Kosenamen.
STRIKTE CHAT-REGELN (SEHR WICHTIG):
1. SCHREIBE NUR REINE TEXT-NACHRICHTEN! BENUTZE NIEMALS STERNCHEN (*lacht*, *sieht dich an* etc.)! Das ist ein WhatsApp Chat, kein Roleplay!
2. Antworte kurz und knackig in 1-3 Sätzen.
3. Nutze Slang ("Nope", "Haha", "nice", "lol", "Babe").`;

        let apiKey = localStorage.getItem('gray_api_key') || '';
        let chatHistory = JSON.parse(localStorage.getItem('gray_chat_history')) || [];
        let sendTimer = null;
        let selectedMsgIndex = null;
        let pressTimer = null;
        let activeQuoteText = null;

        if(apiKey) document.getElementById('apiBar').style.display = 'none';

        if ("Notification" in window && Notification.permission !== "granted") {
            Notification.requestPermission();
        }

        window.onload = () => {
            applySavedImages();
            renderHistory();
            startAutoMessaging();
        };

        function autoResizeTextarea(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 100) + 'px';
        }

        function openSettings() { document.getElementById('settingsModal').classList.add('active'); }
        function closeSettings() { document.getElementById('settingsModal').classList.remove('active'); }

        function handleFileSelect(event, storageKey) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const maxDim = 800;
                    let width = img.width, height = img.height;
                    if (width > height) { if (width > maxDim) { height *= maxDim / width; width = maxDim; } } 
                    else { if (height > maxDim) { width *= maxDim / height; height = maxDim; } }
                    canvas.width = width; canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);
                    localStorage.setItem(storageKey, canvas.toDataURL('image/jpeg', 0.7));
                    applySavedImages();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function applySavedImages() {
            const avatarUrl = localStorage.getItem('gray_avatar_url');
            const bgUrl = localStorage.getItem('gray_bg_url');
            if(avatarUrl) document.getElementById('grayAvatar').innerHTML = `<img src="${avatarUrl}">`;
            else document.getElementById('grayAvatar').innerHTML = 'G';
            if(bgUrl) document.getElementById('chatArea').style.backgroundImage = `url('${bgUrl}')`;
        }

        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if(key) {
                localStorage.setItem('gray_api_key', key);
                apiKey = key;
                document.getElementById('apiBar').style.display = 'none';
            }
        }

        function getCurrentTime() {
            const now = new Date();
            return now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
        }

        function renderHistory() {
            const chatArea = document.getElementById('chatArea');
            chatArea.innerHTML = '';
            chatHistory.forEach((msg, idx) => {
                const type = msg.role === 'user' ? 'outgoing' : 'incoming';
                const msgDiv = document.createElement('div');
                msgDiv.className = `message ${type}`;
                
                msgDiv.addEventListener('touchstart', (e) => startPress(e, idx));
                msgDiv.addEventListener('touchend', cancelPress);
                msgDiv.addEventListener('mousedown', (e) => startPress(e, idx));
                msgDiv.addEventListener('mouseup', cancelPress);

                let contentHTML = ``;
                if(msg.quoted) contentHTML += `<div class="quoted-msg-preview">${msg.quoted}</div>`;
                if(msg.content) contentHTML += `<div>${msg.content.replace(/\n/g, '<br>')}</div>`;
                if(msg.imageUrl) contentHTML += `<img src="${msg.imageUrl}" class="message-image" onclick="window.open('${msg.imageUrl}', '_blank')">`;
                if(msg.reaction) contentHTML += `<div class="reaction-badge">${msg.reaction}</div>`;
                
                let ticksHTML = '';
                if(type === 'outgoing') {
                    const tickClass = msg.status === 'read' ? 'ticks blue' : 'ticks';
                    const tickSymbol = msg.status === 'sent' ? '✓' : '✓✓';
                    ticksHTML = `<span class="${tickClass}">${tickSymbol}</span>`;
                }

                msgDiv.innerHTML = `${contentHTML} <div class="msg-footer"><span class="time">${msg.time || ''}</span>${ticksHTML}</div>`;
                chatArea.appendChild(msgDiv);
            });
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function startPress(e, idx) {
            cancelPress();
            pressTimer = setTimeout(() => {
                showReactionMenu(e, idx);
            }, 450);
        }

        function cancelPress() { if (pressTimer) clearTimeout(pressTimer); }

        function showReactionMenu(e, idx) {
            selectedMsgIndex = idx;
            const bar = document.getElementById('reactionBar');
            const touch = e.touches ? e.touches[0] : e;
            bar.style.top = `${Math.min(touch.clientY - 50, window.innerHeight - 80)}px`;
            bar.style.left = `${Math.min(touch.clientX - 100, window.innerWidth - 260)}px`;
            bar.classList.add('active');
        }

        function closeReactionMenu() { document.getElementById('reactionBar').classList.remove('active'); }

        function reactToMessage(emoji) {
            if(selectedMsgIndex !== null) {
                chatHistory[selectedMsgIndex].reaction = emoji;
                localStorage.setItem('gray_chat_history', JSON.stringify(chatHistory));
                renderHistory();
            }
            closeReactionMenu();
        }

        function setReplyToCurrentMsg() {
            if(selectedMsgIndex !== null) {
                const targetMsg = chatHistory[selectedMsgIndex];
                activeQuoteText = targetMsg.content || "Foto";
                document.getElementById('replyTextPreview').innerText = activeQuoteText;
                document.getElementById('replyBanner').classList.add('active');
            }
            closeReactionMenu();
        }

        function cancelReply() {
            activeQuoteText = null;
            document.getElementById('replyBanner').classList.remove('active');
        }

        function clearMemory() {
            if(confirm("Möchtest du Grays Gedächtnis zurücksetzen?")) {
                chatHistory = [];
                localStorage.removeItem('gray_chat_history');
                renderHistory();
            }
        }

        function handleSendClick() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if(!text) return;

            const newMsg = { 
                role: 'user', 
                content: text, 
                time: getCurrentTime(),
                status: 'delivered'
            };

            if(activeQuoteText) {
                newMsg.quoted = activeQuoteText;
                cancelReply();
            }

            chatHistory.push(newMsg);
            localStorage.setItem('gray_chat_history', JSON.stringify(chatHistory));
            renderHistory();

            input.value = '';
            input.style.height = 'auto';

            if(sendTimer) clearTimeout(sendTimer);

            // 5 Sekunden Zeitfenster für deine Mehrfach-Nachrichten
            sendTimer = setTimeout(() => {
                triggerGrayResponse();
            }, 5000);
        }

        async function triggerGrayResponse() {
            chatHistory.forEach(m => { if(m.role === 'user') m.status = 'read'; });
            renderHistory();

            document.getElementById('status').innerText = 'schreibt...';

            const messagesForAI = [
                { role: 'system', content: SYSTEM_PROMPT },
                { role: 'system', content: `Infos zu Mina: ${USER_INFO}` },
                ...chatHistory.slice(-20).map(m => ({ role: m.role, content: m.content }))
            ];

            try {
                const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: 'openai/gpt-4o-mini',
                        messages: messagesForAI
                    })
                });
                const data = await response.json();
                let reply = data.choices[0].message.content;

                // Strikte Bereinigung von eventuellen Sternchen
                reply = reply.replace(/\*.*?\*/g, '').trim();

                document.getElementById('status').innerText = 'online';
                chatHistory.push({ role: 'assistant', content: reply, time: getCurrentTime() });

                if(Math.random() < 0.25 && chatHistory.length > 2) {
                    const emojis = ['😏', '🔥', '😉', '🖤', '👀'];
                    chatHistory[chatHistory.length - 2].reaction = emojis[Math.floor(Math.random() * emojis.length)];
                }

                localStorage.setItem('gray_chat_history', JSON.stringify(chatHistory));
                renderHistory();

                if (document.hidden && Notification.permission === "granted") {
                    new Notification("Gray ✈️", { body: reply, icon: localStorage.getItem('gray_avatar_url') || "" });
                }

            } catch (err) {
                document.getElementById('status').innerText = 'online';
            }
        }

        // Eigeninitiative: Gray schreibt dir von alleine
        function startAutoMessaging() {
            setInterval(() => {
                const lastMsg = chatHistory[chatHistory.length - 1];
                if(Math.random() < 0.20 && (!lastMsg || lastMsg.role === 'assistant')) {
                    triggerSpontaneousMessage();
                }
            }, 600000);
        }

        async function triggerSpontaneousMessage() {
            document.getElementById('status').innerText = 'schreibt...';
            const prompts = [
                { role: 'system', content: SYSTEM_PROMPT },
                { role: 'system', content: `Schicke Mina eine sehr kurze, freche WhatsApp-Nachricht. Frag sie provokant was sie treibt oder sag kurz bescheid, dass du grad unterwegs bist.` },
                ...chatHistory.slice(-10).map(m => ({ role: m.role, content: m.content }))
            ];

            try {
                const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${apiKey}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ model: 'openai/gpt-4o-mini', messages: prompts })
                });
                const data = await response.json();
                let reply = data.choices[0].message.content;
                reply = reply.replace(/\*.*?\*/g, '').trim();

                document.getElementById('status').innerText = 'online';
                chatHistory.push({ role: 'assistant', content: reply, time: getCurrentTime() });
                localStorage.setItem('gray_chat_history', JSON.stringify(chatHistory));
                renderHistory();

                if (Notification.permission === "granted") {
                    new Notification("Gray ✈️", { body: reply, icon: localStorage.getItem('gray_avatar_url') || "" });
                }
            } catch(e) { document.getElementById('status').innerText = 'online'; }
        }

        async function requestImagePrompt() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if(!text) { alert("Schreib kurz ins Feld, welches Foto du möchtest!"); return; }
            input.value = '';
            chatHistory.push({ role: 'user', content: `[Foto angefragt: ${text}]`, time: getCurrentTime(), status: 'delivered' });
            renderHistory();

            document.getElementById('status').innerText = 'schickt ein Foto...';

            setTimeout(() => {
                chatHistory.forEach(m => { if(m.role === 'user') m.status = 'read'; });
                document.getElementById('status').innerText = 'online';
                chatHistory.push({ role: 'assistant', content: "Hier, extra für dich aufgenommen 😉", imageUrl: "https://images.unsplash.com/photo-1508614589041-895b88991e3e?auto=format&fit=crop&w=800&q=80", time: getCurrentTime() });
                localStorage.setItem('gray_chat_history', JSON.stringify(chatHistory));
                renderHistory();
            }, 2500);
        }
    </script>
</body>
</html>
